<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>
<title>DISC//ARENA</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 600px;
    overflow: hidden;
    background: #05070d;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* =========================
     HUD
  ========================= */

  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    width: 100%;
    padding: 14px 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .hudBox {
    min-width: 85px;
  }

  .hudLabel {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .55;
    margin-bottom: 3px;
  }

  .hudValue {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  #energyContainer {
    position: absolute;
    top: 53px;
    left: 16px;
    right: 16px;
    height: 5px;
    border-radius: 10px;
    background: rgba(255,255,255,.12);
    overflow: hidden;
  }

  #energyBar {
    width: 100%;
    height: 100%;
    background: #48e8ff;
    transition: width .15s linear;
  }

  /* =========================
     Controls
  ========================= */

  #controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 190px;
    padding:
      12px
      18px
      calc(18px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
    z-index: 15;
  }

  #joystick {
    position: absolute;
    left: 20px;
    bottom: 24px;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.035);
    pointer-events: auto;
    touch-action: none;
  }

  #joystick::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    margin-left: -28px;
    margin-top: -28px;
    border-radius: 50%;
    border: 2px solid rgba(72,232,255,.65);
    background: rgba(72,232,255,.12);
    box-shadow: 0 0 20px rgba(72,232,255,.18);
    pointer-events: none;
  }

  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 38px;
    height: 38px;
    margin-left: -19px;
    margin-top: -19px;
    border-radius: 50%;
    background: #48e8ff;
    box-shadow: 0 0 18px rgba(72,232,255,.7);
    pointer-events: none;
    transform: translate(0,0);
  }

  .actionButtons {
    position: absolute;
    right: 18px;
    bottom: 24px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    pointer-events: auto;
  }

  .actionButton {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
  }

  .actionButton:active {
    transform: scale(.93);
    background: rgba(255,255,255,.16);
  }

  #throwButton {
    width: 84px;
    height: 84px;
    border-color: rgba(72,232,255,.65);
    color: #48e8ff;
    box-shadow: 0 0 22px rgba(72,232,255,.1);
  }

  #dashButton {
    border-color: rgba(255,255,255,.35);
  }

  #blockButton {
    border-color: rgba(255,230,80,.45);
    color: #ffe650;
  }

  /* =========================
     Screens
  ========================= */

  .screen {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px;
    background:
      radial-gradient(
        circle at center,
        rgba(20,35,55,.45),
        rgba(2,4,9,.96) 72%
      );
  }

  .screenCard {
    width: min(100%, 430px);
    text-align: center;
  }

  .logo {
    font-size: clamp(38px, 11vw, 66px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 12px;
    text-shadow:
      0 0 12px rgba(72,232,255,.55),
      0 0 30px rgba(72,232,255,.2);
  }

  .slash {
    color: #48e8ff;
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 4px;
    opacity: .5;
    margin-bottom: 38px;
  }

  .startButton {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-width: 190px;
    height: 58px;
    padding: 0 25px;
    border: 1px solid rgba(72,232,255,.7);
    border-radius: 8px;
    background: rgba(72,232,255,.08);
    color: #48e8ff;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    touch-action: manipulation;
    pointer-events: auto;
    position: relative;
    z-index: 40;
    user-select: none;
    -webkit-user-select: none;
    box-shadow:
      0 0 25px rgba(72,232,255,.08),
      inset 0 0 20px rgba(72,232,255,.03);
  }

  .startButton:active {
    transform: scale(.97);
    background: rgba(72,232,255,.18);
  }

  .instructions {
    margin-top: 30px;
    font-size: 11px;
    line-height: 1.8;
    letter-spacing: 1px;
    opacity: .55;
  }

  #gameOver {
    display: none;
  }

  .gameOverTitle {
    color: #ff536d;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }

  .finalScore {
    font-size: 15px;
    letter-spacing: 3px;
    opacity: .65;
    margin-bottom: 30px;
  }

  @media (orientation: landscape) {
    #game {
      max-width: 430px;
    }
  }
</style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <!-- HUD -->
  <div id="hud">

    <div class="hudBox">
      <div class="hudLabel">ROUND</div>
      <div class="hudValue" id="roundText">1</div>
    </div>

    <div class="hudBox" style="text-align:right;">
      <div class="hudLabel">SCORE</div>
      <div class="hudValue" id="scoreText">0</div>
    </div>

  </div>

  <div id="energyContainer">
    <div id="energyBar"></div>
  </div>

  <!-- CONTROLS -->
  <div id="controls">

    <div id="joystick">
      <div id="joystickKnob"></div>
    </div>

    <div class="actionButtons">

      <button
        id="blockButton"
        class="actionButton"
        type="button"
      >
        BLOCK
      </button>

      <button
        id="dashButton"
        class="actionButton"
        type="button"
      >
        DASH
      </button>

      <button
        id="throwButton"
        class="actionButton"
        type="button"
      >
        THROW
      </button>

    </div>

  </div>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen">

    <div class="screenCard">

      <div class="logo">
        DISC<span class="slash">//</span>ARENA
      </div>

      <div class="subtitle">
        DIGITAL COMBAT PROTOTYPE
      </div>

      <button
        id="startBtn"
        class="startButton"
        type="button"
      >
        ENTER ARENA
      </button>

      <div class="instructions">
        BLUE PLAYER — BOTTOM<br>
        RED ENEMY — TOP<br><br>
        MOVE • THROW • BLOCK • DASH
      </div>

    </div>

  </div>

  <!-- GAME OVER -->
  <div id="gameOver" class="screen">

    <div class="screenCard">

      <div class="gameOverTitle">
        ELIMINATED
      </div>

      <div class="finalScore">
        FINAL SCORE:
        <span id="finalScore">0</span>
      </div>

      <button
        id="restartBtn"
        class="startButton"
        type="button"
      >
        REMATCH
      </button>

    </div>

  </div>

</div>

<script>
/* =========================================================
   DISC//ARENA
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const roundText = document.getElementById("roundText");
const scoreText = document.getElementById("scoreText");
const energyBar = document.getElementById("energyBar");
const finalScore = document.getElementById("finalScore");

const joystick = document.getElementById("joystick");
const joystickKnob = document.getElementById("joystickKnob");

const blockButton = document.getElementById("blockButton");
const dashButton = document.getElementById("dashButton");
const throwButton = document.getElementById("throwButton");


/* =========================================================
   CANVAS
   ========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();

  W = rect.width;
  H = rect.height;

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


/* =========================================================
   ARENA
   ========================================================= */

function arenaTop() {
  return 70;
}

function arenaBottom() {
  return H - 105;
}

function arenaHeight() {
  return arenaBottom() - arenaTop();
}

function centerLine() {
  return arenaTop() + arenaHeight() / 2;
}


/* =========================================================
   GAME STATE
   ========================================================= */

let running = false;

let round = 1;
let score = 0;
let energy = 100;

let gameStartTime = 0;

let lastTime = performance.now();

let particles = [];

let player;
let enemy;

let playerDisc = null;
let enemyDisc = null;


/* =========================================================
   PLAYER
   ========================================================= */

function createPlayer() {

  return {
    x: W / 2,
    y: centerLine() + arenaHeight() * .25,

    radiusX: 15,
    radiusY: 25,

    speed: 255,

    invincible: 0,
    dashCooldown: 0,

    blocking: false,

    directionX: 0,
    directionY: -1
  };
}


/* =========================================================
   ENEMY
   ========================================================= */

function createEnemy() {

  return {
    x: W / 2,
    y: centerLine() - arenaHeight() * .25,

    radiusX: 15,
    radiusY: 25,

    speed: 145,

    throwCooldown: .8,

    discRecovered: true,

    directionX: 0,
    directionY: 1
  };
}


/* =========================================================
   RESET
   ========================================================= */

function resetGame() {

  round = 1;
  score = 0;
  energy = 100;

  gameStartTime = performance.now();

  playerDisc = null;
  enemyDisc = null;

  player = createPlayer();
  enemy = createEnemy();

  particles = [];

  updateHUD();
}


/* =========================================================
   START / END
   ========================================================= */

function startGame() {

  resetGame();

  running = true;

  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";

  lastTime = performance.now();
}

function endGame() {

  running = false;

  finalScore.textContent = score;

  gameOverScreen.style.display = "flex";
}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

  roundText.textContent = round;
  scoreText.textContent = score;

  energyBar.style.width = Math.max(0, energy) + "%";

  if (energy > 60) {
    energyBar.style.background = "#48e8ff";
  } else if (energy > 30) {
    energyBar.style.background = "#ffe34d";
  } else {
    energyBar.style.background = "#ff536d";
  }
}


/* =========================================================
   INPUT
   ========================================================= */

const keys = {
  left: false,
  right: false,
  up: false,
  down: false
};

let joystickActive = false;
let joystickPointerId = null;

let joystickX = 0;
let joystickY = 0;


/* Keyboard */

window.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
    keys.left = true;
  }

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    keys.right = true;
  }

  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
    keys.up = true;
  }

  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
    keys.down = true;
  }

  if (e.code === "Space") {
    throwPlayerDisc();
  }

  if (e.key.toLowerCase() === "e") {
    dash();
  }

  if (e.key.toLowerCase() === "q") {
    player.blocking = true;
  }
});

window.addEventListener("keyup", e => {

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
    keys.left = false;
  }

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    keys.right = false;
  }

  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
    keys.up = false;
  }

  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
    keys.down = false;
  }

  if (e.key.toLowerCase() === "q") {
    player.blocking = false;
  }
});


/* =========================================================
   JOYSTICK
   ========================================================= */

function updateJoystick(clientX, clientY) {

  const rect = joystick.getBoundingClientRect();

  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = clientX - cx;
  let dy = clientY - cy;

  const maxDistance = 39;

  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance > maxDistance) {

    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;
  }

  joystickX = dx / maxDistance;
  joystickY = dy / maxDistance;

  joystickKnob.style.transform =
    `translate(${dx}px, ${dy}px)`;
}


function resetJoystick() {

  joystickActive = false;
  joystickPointerId = null;

  joystickX = 0;
  joystickY = 0;

  joystickKnob.style.transform =
    "translate(0px, 0px)";
}


joystick.addEventListener("pointerdown", e => {

  e.preventDefault();

  joystickActive = true;
  joystickPointerId = e.pointerId;

  joystick.setPointerCapture(e.pointerId);

  updateJoystick(e.clientX, e.clientY);
});


joystick.addEventListener("pointermove", e => {

  if (!joystickActive) return;
  if (e.pointerId !== joystickPointerId) return;

  e.preventDefault();

  updateJoystick(e.clientX, e.clientY);
});


joystick.addEventListener("pointerup", e => {

  if (e.pointerId === joystickPointerId) {
    resetJoystick();
  }
});


joystick.addEventListener("pointercancel", resetJoystick);


/* =========================================================
   ACTION BUTTONS
   ========================================================= */

function pressBlock(e) {

  e.preventDefault();

  player.blocking = true;
}

function releaseBlock(e) {

  e.preventDefault();

  player.blocking = false;
}

blockButton.addEventListener("pointerdown", pressBlock);
blockButton.addEventListener("pointerup", releaseBlock);
blockButton.addEventListener("pointercancel", releaseBlock);
blockButton.addEventListener("pointerleave", releaseBlock);


dashButton.addEventListener("pointerdown", e => {

  e.preventDefault();

  dash();
});


throwButton.addEventListener("pointerdown", e => {

  e.preventDefault();

  throwPlayerDisc();
});


/* =========================================================
   START BUTTON
   iPHONE-SAFE POINTER HANDLING
   ========================================================= */

function handleStartPress(e) {

  e.preventDefault();
  e.stopPropagation();

  startGame();
}

startBtn.addEventListener(
  "pointerdown",
  handleStartPress,
  { passive: false }
);

restartBtn.addEventListener(
  "pointerdown",
  handleStartPress,
  { passive: false }
);


/* Prevent accidental scrolling while playing */

document.addEventListener(
  "touchmove",
  e => {

    if (
      e.target &&
      e.target.closest &&
      e.target.closest(".startButton")
    ) {
      return;
    }

    e.preventDefault();
  },
  { passive: false }
);


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(dt) {

  let dx = joystickX;
  let dy = joystickY;

  if (!joystickActive) {

    dx =
      (keys.right ? 1 : 0) -
      (keys.left ? 1 : 0);

    dy =
      (keys.down ? 1 : 0) -
      (keys.up ? 1 : 0);
  }

  const magnitude =
    Math.sqrt(dx * dx + dy * dy);

  if (magnitude > 1) {

    dx /= magnitude;
    dy /= magnitude;
  }

  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;

  if (Math.abs(dx) + Math.abs(dy) > .05) {

    player.directionX = dx;
    player.directionY = dy;
  }

  keepPlayersOnTheirSides();

  player.dashCooldown =
    Math.max(0, player.dashCooldown - dt);

  player.invincible =
    Math.max(0, player.invincible - dt);
}


/* =========================================================
   PLAYER LIMITS
   ========================================================= */

function keepPlayersOnTheirSides() {

  const minX = 20;
  const maxX = W - 20;

  player.x = Math.max(
    minX,
    Math.min(maxX, player.x)
  );

  enemy.x = Math.max(
    minX,
    Math.min(maxX, enemy.x)
  );


  /* Blue player */

  const playerTop =
    centerLine() + 18;

  const playerBottom =
    arenaBottom() - 22;

  player.y = Math.max(
    playerTop,
    Math.min(playerBottom, player.y)
  );


  /* Red enemy */

  const enemyTop =
    arenaTop() + 22;

  const enemyBottom =
    centerLine() - 18;

  enemy.y = Math.max(
    enemyTop,
    Math.min(enemyBottom, enemy.y)
  );
}


/* =========================================================
   DASH
   ========================================================= */

function dash() {

  if (!running) return;

  if (player.dashCooldown > 0) return;

  let dx = player.directionX;
  let dy = player.directionY;

  const len =
    Math.sqrt(dx * dx + dy * dy);

  if (len < .01) {
    dy = -1;
  } else {
    dx /= len;
    dy /= len;
  }

  player.x += dx * 105;
  player.y += dy * 105;

  player.invincible = .35;
  player.dashCooldown = 1;

  createBurst(
    player.x,
    player.y,
    "#48e8ff",
    14
  );

  keepPlayersOnTheirSides();
}


/* =========================================================
   DISC THROW
   ========================================================= */

function throwPlayerDisc() {

  if (!running) return;

  if (playerDisc) return;

  const dx = enemy.x - player.x;
  const dy = enemy.y - player.y;

  const len =
    Math.sqrt(dx * dx + dy * dy) || 1;

  const speed = 440;

  playerDisc = {
    owner: "player",

    x: player.x,
    y: player.y - 22,

    vx: dx / len * speed,
    vy: dy / len * speed,

    radius: 9,

    life: 6
  };

  createBurst(
    player.x,
    player.y,
    "#48e8ff",
    8
  );
}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemy(dt) {

  const dx = player.x - enemy.x;

  const horizontalSpeed =
    enemy.speed * dt;

  if (Math.abs(dx) > 5) {

    enemy.x +=
      Math.sign(dx) *
      Math.min(Math.abs(dx), horizontalSpeed);

    enemy.directionX =
      Math.sign(dx);
  } else {

    enemy.directionX = 0;
  }


  /*
    Limited vertical movement.
    Enemy stays entirely in top half.
  */

  const idealY =
    centerLine() -
    arenaHeight() * .25;

  const verticalDifference =
    idealY - enemy.y;

  if (Math.abs(verticalDifference) > 4) {

    enemy.y +=
      Math.sign(verticalDifference) *
      enemy.speed *
      .28 *
      dt;

    enemy.directionY =
      Math.sign(verticalDifference);
  }


  enemy.throwCooldown =
    Math.max(
      0,
      enemy.throwCooldown - dt
    );


  /*
    Enemy can only throw if its previous
    disc has been recovered.
  */

  if (
    enemy.throwCooldown <= 0 &&
    enemy.discRecovered &&
    !enemyDisc
  ) {

    throwEnemyDisc();
  }

  keepPlayersOnTheirSides();
}


/* =========================================================
   ENEMY THROW
   ========================================================= */

function throwEnemyDisc() {

  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;

  const len =
    Math.sqrt(dx * dx + dy * dy) || 1;

  const speed =
    385 + Math.min(round * 8, 90);

  enemyDisc = {

    owner: "enemy",

    x: enemy.x,
    y: enemy.y + 22,

    vx: dx / len * speed,
    vy: dy / len * speed,

    radius: 9,

    life: 6
  };

  enemy.discRecovered = false;

  enemy.throwCooldown =
    Math.max(
      .7,
      1.4 - round * .035
    );
}


/* =========================================================
   DISC UPDATE
   ========================================================= */

function updateDisc(disc, dt) {

  disc.x += disc.vx * dt;
  disc.y += disc.vy * dt;

  disc.life -= dt;


  const leftWall = 18;
  const rightWall = W - 18;

  const topWall = arenaTop();
  const bottomWall = arenaBottom();


  if (disc.x - disc.radius < leftWall) {

    disc.x = leftWall + disc.radius;
    disc.vx = Math.abs(disc.vx);

    createBurst(
      disc.x,
      disc.y,
      disc.owner === "player"
        ? "#48e8ff"
        : "#ff536d",
      4
    );
  }


  if (disc.x + disc.radius > rightWall) {

    disc.x = rightWall - disc.radius;
    disc.vx = -Math.abs(disc.vx);

    createBurst(
      disc.x,
      disc.y,
      disc.owner === "player"
        ? "#48e8ff"
        : "#ff536d",
      4
    );
  }


  if (disc.y - disc.radius < topWall) {

    disc.y = topWall + disc.radius;
    disc.vy = Math.abs(disc.vy);

    createBurst(
      disc.x,
      disc.y,
      disc.owner === "player"
        ? "#48e8ff"
        : "#ff536d",
      4
    );
  }


  if (disc.y + disc.radius > bottomWall) {

    disc.y = bottomWall - disc.radius;
    disc.vy = -Math.abs(disc.vy);

    createBurst(
      disc.x,
      disc.y,
      disc.owner === "player"
        ? "#48e8ff"
        : "#ff536d",
      4
    );
  }
}


/* =========================================================
   COLLISION HELPERS
   ========================================================= */

function circleHitsOval(disc, target) {

  const dx =
    disc.x - target.x;

  const dy =
    disc.y - target.y;

  const rx =
    target.radiusX + disc.radius;

  const ry =
    target.radiusY + disc.radius;

  return (
    (dx * dx) / (rx * rx) +
    (dy * dy) / (ry * ry)
  ) <= 1;
}


/* =========================================================
   PLAYER DISC COLLISION
   ========================================================= */

function checkPlayerDiscCollision() {

  if (!playerDisc) return;

  if (
    circleHitsOval(
      playerDisc,
      enemy
    )
  ) {

    createBurst(
      enemy.x,
      enemy.y,
      getEnemyColor(),
      18
    );

    score += 100;

    damageEnemy();

    playerDisc = null;
  }
}


/* =========================================================
   ENEMY DISC COLLISION
   ========================================================= */

function checkEnemyDiscCollision() {

  if (!enemyDisc) return;

  if (
    circleHitsOval(
      enemyDisc,
      player
    )
  ) {

    /*
      Blocking catches/deflects the disc.
    */

    if (player.blocking) {

      score += 25;

      enemy.discRecovered = true;

      createBurst(
        player.x,
        player.y,
        "#ffe34d",
        18
      );

      /*
        Send disc back toward enemy.
      */

      const dx =
        enemy.x - player.x;

      const dy =
        enemy.y - player.y;

      const len =
        Math.sqrt(dx * dx + dy * dy) || 1;

      const speed = 450;

      enemyDisc.vx =
        dx / len * speed;

      enemyDisc.vy =
        dy / len * speed;

      /*
        Keep it alive after block.
      */

      enemyDisc.life = 5;

      /*
        Transfer ownership so it can
        damage the enemy.
      */

      enemyDisc.owner = "player";

      playerDisc = enemyDisc;
      enemyDisc = null;

      updateHUD();

      return;
    }


    /*
      Player gets hit.
      Enemy has recovered its disc.
    */

    enemy.discRecovered = true;

    enemyDisc = null;

    damagePlayer();
  }
}


/* =========================================================
   DAMAGE
   ========================================================= */

function damagePlayer() {

  if (player.invincible > 0) return;

  energy -= 25;

  player.invincible = .7;

  createBurst(
    player.x,
    player.y,
    "#ff536d",
    25
  );

  updateHUD();

  if (energy <= 0) {

    energy = 0;

    updateHUD();

    endGame();
  }
}


function damageEnemy() {

  round++;

  score += 150;

  energy =
    Math.min(
      100,
      energy + 15
    );

  enemy = createEnemy();

  enemy.speed =
    145 + Math.min(round * 7, 90);

  playerDisc = null;
  enemyDisc = null;

  createBurst(
    enemy.x,
    enemy.y,
    getEnemyColor(),
    30
  );

  updateHUD();
}


/* =========================================================
   ENEMY COLOR
   ========================================================= */

function getEnemyColor() {

  const elapsed =
    (performance.now() - gameStartTime) / 1000;

  if (elapsed < 60) {
    return "#ff536d";
  }

  if (elapsed < 65) {
    return "#ffe34d";
  }

  return "#ff8a3d";
}


/* =========================================================
   PARTICLES
   ========================================================= */

function createBurst(
  x,
  y,
  color,
  count
) {

  for (let i = 0; i < count; i++) {

    const angle =
      Math.random() *
      Math.PI *
      2;

    const speed =
      30 +
      Math.random() * 130;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        .25 +
        Math.random() *
        .5,

      maxLife:
        .75,

      size:
        1.5 +
        Math.random() * 3,

      color
    });
  }
}


function updateParticles(dt) {

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.vx *= .97;
    p.vy *= .97;

    p.life -= dt;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

  ctx.fillStyle = "#05070d";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Subtle glow in arena.
  */

  const gradient =
    ctx.createRadialGradient(
      W / 2,
      centerLine(),
      20,
      W / 2,
      centerLine(),
      Math.max(W, H) * .7
    );

  gradient.addColorStop(
    0,
    "rgba(30,55,80,.20)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* =========================================================
   DRAW GRID
   ========================================================= */

function drawGrid() {

  const top = arenaTop();
  const bottom = arenaBottom();

  ctx.save();

  ctx.strokeStyle =
    "rgba(72,232,255,.055)";

  ctx.lineWidth = 1;

  const spacing = 32;

  for (
    let x = 18;
    x < W;
    x += spacing
  ) {

    ctx.beginPath();

    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);

    ctx.stroke();
  }


  for (
    let y = top;
    y < bottom;
    y += spacing
  ) {

    ctx.beginPath();

    ctx.moveTo(18, y);
    ctx.lineTo(W - 18, y);

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   DRAW ARENA
   ========================================================= */

function drawArena() {

  const top = arenaTop();
  const bottom = arenaBottom();
  const middle = centerLine();

  ctx.save();


  /*
    Arena border
  */

  ctx.strokeStyle =
    "rgba(72,232,255,.25)";

  ctx.lineWidth = 1.5;

  ctx.strokeRect(
    18,
    top,
    W - 36,
    bottom - top
  );


  /*
    Center divider
  */

  ctx.setLineDash([9, 9]);

  ctx.strokeStyle =
    "rgba(255,255,255,.28)";

  ctx.lineWidth = 1;

  ctx.beginPath();

  ctx.moveTo(18, middle);
  ctx.lineTo(W - 18, middle);

  ctx.stroke();

  ctx.setLineDash([]);


  /*
    Labels
  */

  ctx.font =
    "900 9px Arial";

  ctx.letterSpacing = "2px";

  ctx.textAlign = "center";

  ctx.fillStyle =
    "rgba(255,83,109,.45)";

  ctx.fillText(
    "RED SIDE",
    W / 2,
    top + 18
  );

  ctx.fillStyle =
    "rgba(72,232,255,.4)";

  ctx.fillText(
    "BLUE SIDE",
    W / 2,
    bottom - 10
  );


  ctx.restore();
}


/* =========================================================
   DRAW CHARACTER
   ========================================================= */

function drawCharacter(
  entity,
  color,
  isPlayer
) {

  ctx.save();

  ctx.translate(
    entity.x,
    entity.y
  );


  /*
    Glow
  */

  ctx.shadowColor = color;
  ctx.shadowBlur =
    entity.invincible > 0
      ? 30
      : 18;


  /*
    Main vertical oval
  */

  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    entity.radiusX,
    entity.radiusY,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Inner core
  */

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "rgba(255,255,255,.28)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -5,
    entity.radiusX * .32,
    entity.radiusY * .62,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Direction indicator
  */

  ctx.fillStyle =
    "rgba(255,255,255,.9)";

  ctx.beginPath();

  if (isPlayer) {

    ctx.moveTo(0, -34);
    ctx.lineTo(-5, -25);
    ctx.lineTo(5, -25);

  } else {

    ctx.moveTo(0, 34);
    ctx.lineTo(-5, 25);
    ctx.lineTo(5, 25);
  }

  ctx.closePath();

  ctx.fill();


  /*
    Block ring
  */

  if (
    isPlayer &&
    player.blocking
  ) {

    ctx.strokeStyle =
      "#ffe34d";

    ctx.lineWidth = 3;

    ctx.shadowColor =
      "#ffe34d";

    ctx.shadowBlur = 18;

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      entity.radiusX + 10,
      entity.radiusY + 10,
      0,
      0,
      Math.PI * 2
    );

    ctx.stroke();
  }


  ctx.restore();
}


/* =========================================================
   DRAW DISC
   ========================================================= */

function drawDisc(
  disc
) {

  if (!disc) return;

  const color =
    disc.owner === "player"
      ? "#48e8ff"
      : getEnemyColor();


  ctx.save();

  ctx.translate(
    disc.x,
    disc.y
  );

  ctx.rotate(
    Math.atan2(
      disc.vy,
      disc.vx
    )
  );

  ctx.shadowColor = color;
  ctx.shadowBlur = 22;


  /*
    Disc body
  */

  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    13,
    5,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    Bright edge
  */

  ctx.strokeStyle =
    "rgba(255,255,255,.8)";

  ctx.lineWidth = 1.5;

  ctx.stroke();


  /*
    Center
  */

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "rgba(255,255,255,.8)";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles() {

  for (const p of particles) {

    const alpha =
      Math.max(
        0,
        p.life / p.maxLife
      );

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.fillStyle = p.color;

    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   DRAW
   ========================================================= */

function draw() {

  drawBackground();
  drawGrid();
  drawArena();

  if (player) {

    drawCharacter(
      player,
      "#48e8ff",
      true
    );
  }

  if (enemy) {

    drawCharacter(
      enemy,
      getEnemyColor(),
      false
    );
  }

  drawDisc(playerDisc);
  drawDisc(enemyDisc);

  drawParticles();
}


/* =========================================================
   GAME UPDATE
   ========================================================= */

function update(dt) {

  if (!running) return;

  updatePlayer(dt);

  updateEnemy(dt);


  if (playerDisc) {

    updateDisc(
      playerDisc,
      dt
    );

    checkPlayerDiscCollision();

    if (
      playerDisc &&
      playerDisc.life <= 0
    ) {

      playerDisc = null;
    }
  }


  if (enemyDisc) {

    updateDisc(
      enemyDisc,
      dt
    );

    checkEnemyDiscCollision();

    if (
      enemyDisc &&
      enemyDisc.life <= 0
    ) {

      /*
        Strict recovery rule:
        if enemy's disc expires without
        returning to it or hitting player,
        enemy remains locked.
      */

      enemyDisc = null;
    }
  }


  updateParticles(dt);

  updateHUD();
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(now) {

  const dt =
    Math.min(
      (now - lastTime) / 1000,
      .033
    );

  lastTime = now;

  update(dt);

  draw();

  requestAnimationFrame(gameLoop);
}


requestAnimationFrame(gameLoop);


/* =========================================================
   INITIAL DRAW
   ========================================================= */

resetGame();
draw();

</script>

</body>
</html>
